server.port = 8083
spring.application.name = contentService

spring.config.import=aws-parameterstore:/config/contentService/

security.oauth2.client.registration.google.client-id= your-google-client-id
spring.security.oauth2.client.registration.google.client-secret= your-google-client-secret
spring.security.oauth2.client.registration.google.redirect-uri=${redirect_uri}
spring.security.oauth2.client.registration.google.scope=openid